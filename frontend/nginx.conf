# Servidor estático da imagem Docker do front (SPA).
server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Assets têm hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html e version.json nunca em cache, para o app perceber versão nova.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
