# Sobe o sistema inteiro localmente: PostgreSQL + API + front.
#
#   docker compose up --build
#
# Front: http://localhost:5180   API: http://localhost:4444/health
# Contas de demonstração (criadas na subida): veja o README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_quote
      TZ: UTC
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_quote"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # development: o seed de contas de demonstração se recusa a rodar em production.
      NODE_ENV: development
      PORT: 4444
      TZ: America/Sao_Paulo
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: event_quote
      DB_USER: postgres
      DB_PASS: postgres
      JWT_SECRET: segredo-local-somente-para-demonstracao-troque-0001
      CORS_ORIGINS: http://localhost:5180,http://localhost:5173
      PUBLIC_API_URL: http://localhost:4444
      UPLOADS_DIR: /app/uploads
      # O catálogo canônico é o mesmo arquivo que o front usa.
      SEED_FILE: /seed/canonicalSeed.bundle.json
    volumes:
      - ./frontend/src/features/budgets/migration:/seed:ro
      - uploads:/app/uploads
    # Cria as tabelas, as contas de demonstração e o catálogo (só se estiver
    # vazio), e sobe a API.
    command: >
      sh -c "node src/scripts/seed_demo_accounts.js &&
             node src/scripts/seed_canonical_catalog.js --if-empty &&
             node src/app.js"
    ports:
      - "4444:4444"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4444
    depends_on:
      - backend
    ports:
      - "5180:3000"

volumes:
  db-data:
  uploads:
